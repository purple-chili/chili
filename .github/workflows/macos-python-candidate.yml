name: macOS Python Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Python 3.14 test environment
        run: |
          uv venv --python 3.14
          uv pip install 'polars==1.39.3' pytest 'pytest-xdist==3.8.0'
      - name: Verify macOS dependency graph excludes mimalloc
        run: |
          python3 - <<'PY'
          import subprocess
          graph = subprocess.check_output([
              'cargo', 'tree', '--locked', '--prefix', 'none',
              '--manifest-path', 'crates/chili-py/Cargo.toml',
              '--target', 'aarch64-apple-darwin',
          ], text=True)
          assert not any(line.startswith(('mimalloc v', 'libmimalloc-sys v'))
                         for line in graph.splitlines()), graph
          PY
      - name: Build candidate wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --locked --out dist --manifest-path crates/chili-py/Cargo.toml
      - name: Upload candidate wheel
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-python-candidate
          path: dist/*.whl
          if-no-files-found: error
      - name: Install candidate
        run: uv pip install dist/*.whl
      - name: Test native extension with eight workers
        run: uv run --no-sync python -m pytest -n 8 -q crates/chili-py/tests
